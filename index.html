<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Color Live Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    h1 { margin-bottom: 4px; font-size: 1.3em; }
    .subtitle { color: #888; margin-bottom: 12px; font-size: 0.8em; }

    .status {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 12px;
      font-size: 0.8em;
      text-align: center;
    }
    .status.ready { border-color: #00b894; color: #00b894; }
    .status.error { border-color: #e17055; color: #e17055; }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      padding: 8px 20px;
      border: 2px solid #0f3460;
      border-radius: 8px;
      background: #16213e;
      color: #aaa;
      cursor: pointer;
      font-size: 0.85em;
      transition: all 0.2s;
    }
    .mode-btn.active { border-color: #e94560; color: #fff; background: #e94560; }

    /* Video area */
    .video-container {
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      max-width: 640px;
      width: 100%;
    }
    .video-container video {
      display: none;
      width: 100%;
    }
    .video-container canvas {
      display: block;
      width: 100%;
    }
    .fps-counter {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7em;
      font-family: monospace;
    }
    .color-label {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.8em;
    }

    /* Upload area (photo mode) */
    .upload-area {
      border: 2px dashed #0f3460;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      max-width: 640px;
      width: 100%;
    }
    .upload-area:hover { border-color: #e94560; }
    .upload-area input { display: none; }

    /* Photo comparison */
    .photo-container {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }
    .photo-wrapper {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #16213e;
    }
    .photo-wrapper canvas { display: block; max-width: 310px; height: auto; }
    .photo-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 6px;
      text-align: center;
      font-size: 0.8em;
    }

    /* Color palette */
    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
      max-width: 640px;
    }
    .color-btn {
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8em;
      color: #fff;
      background: #16213e;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .color-btn:hover { transform: scale(1.05); }
    .color-btn.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Intensity slider */
    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
      max-width: 640px;
      width: 100%;
    }
    .slider-group { flex: 1; min-width: 180px; }
    .slider-group label { display: block; font-size: 0.75em; margin-bottom: 2px; color: #aaa; }
    .slider-group input[type=range] { width: 100%; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>Hair Color Live Preview</h1>
  <p class="subtitle">Real-time camera color change with MediaPipe</p>
  <div class="status" id="status">Initializing...</div>

  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeCameraBtn">Camera (Live)</button>
    <button class="mode-btn" id="modePhotoBtn">Photo (Upload)</button>
  </div>

  <!-- Camera mode -->
  <div id="cameraMode">
    <div class="video-container" id="videoContainer">
      <video id="video" autoplay playsinline></video>
      <canvas id="liveCanvas"></canvas>
      <div class="fps-counter" id="fps">-- fps</div>
      <div class="color-label" id="liveColorLabel">Ash Brown</div>
    </div>
  </div>

  <!-- Photo mode -->
  <div id="photoMode" class="hidden">
    <div class="upload-area" id="uploadArea">
      <p>Click or drag & drop a photo</p>
      <p style="font-size:0.75em; color:#888; margin-top:6px;">JPG/PNG supported</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="photo-container hidden" id="photoContainer">
      <div class="photo-wrapper">
        <canvas id="originalCanvas"></canvas>
        <div class="photo-label">Original</div>
      </div>
      <div class="photo-wrapper">
        <canvas id="resultCanvas"></canvas>
        <div class="photo-label" id="resultLabel">Result</div>
      </div>
    </div>
  </div>

  <!-- Shared controls -->
  <div class="color-palette" id="colorPalette"></div>
  <div class="controls">
    <div class="slider-group">
      <label>Intensity: <span id="intensityValue">70</span>%</label>
      <input type="range" id="intensity" min="0" max="100" value="70">
    </div>
    <div class="slider-group">
      <label>Brightness: <span id="brightnessValue">0</span></label>
      <input type="range" id="brightness" min="-50" max="50" value="0">
    </div>
  </div>

  <script type="module">
    import { ImageSegmenter, FilesetResolver } from
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm';

    // --- Color presets ---
    const COLORS = [
      { name: 'Ash Brown',    h: 25,  s: 0.35, v: 0.50, bg: '#7a5c47' },
      { name: 'Pink Beige',   h: 350, s: 0.28, v: 0.70, bg: '#c4868e' },
      { name: 'Olive Beige',  h: 42,  s: 0.35, v: 0.60, bg: '#a38a5c' },
      { name: 'Lavender',     h: 270, s: 0.32, v: 0.60, bg: '#8c6aab' },
      { name: 'Dark Cherry',  h: 340, s: 0.55, v: 0.40, bg: '#8c3050' },
      { name: 'Honey Blonde', h: 38,  s: 0.55, v: 0.78, bg: '#c9a04a' },
      { name: 'Blue Black',   h: 220, s: 0.30, v: 0.18, bg: '#202838' },
      { name: 'Copper',       h: 18,  s: 0.65, v: 0.60, bg: '#b86535' },
    ];

    // --- State ---
    let segmenter = null;
    let selectedColor = COLORS[0];
    let mode = 'camera'; // 'camera' | 'photo'
    let cameraRunning = false;
    let animFrameId = null;

    // Photo mode state
    let photoOriginalData = null;
    let photoMask = null;
    let photoW = 0, photoH = 0;

    // Elements
    const statusEl = document.getElementById('status');
    const video = document.getElementById('video');
    const liveCanvas = document.getElementById('liveCanvas');
    const liveCtx = liveCanvas.getContext('2d', { willReadFrequently: true });
    const fpsEl = document.getElementById('fps');
    const liveColorLabel = document.getElementById('liveColorLabel');
    const originalCanvas = document.getElementById('originalCanvas');
    const resultCanvas = document.getElementById('resultCanvas');
    const resultLabel = document.getElementById('resultLabel');
    const intensitySlider = document.getElementById('intensity');
    const brightnessSlider = document.getElementById('brightness');

    // --- HSV helpers ---
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0, s = max === 0 ? 0 : d / max, v = max;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return [h * 360, s, v];
    }

    function hsvToRgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r, g, b;
      if (h < 60)       { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else              { r = c; g = 0; b = x; }
      return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255),
      ];
    }

    // --- Apply color to pixels using mask ---
    function applyColorToPixels(srcData, maskData, width, height, outData) {
      const intensity = intensitySlider.value / 100;
      const brightnessAdj = brightnessSlider.value / 100;
      const totalPixels = width * height;

      for (let i = 0; i < totalPixels; i++) {
        const alpha = maskData[i] * intensity;
        const px = i * 4;
        const r = srcData[px], g = srcData[px + 1], b = srcData[px + 2];

        if (alpha > 0.05) {
          const [oh, os, ov] = rgbToHsv(r, g, b);
          const newH = selectedColor.h;
          const newS = selectedColor.s * 0.65 + os * 0.35;
          const newV = Math.min(1, Math.max(0, selectedColor.v * 0.35 + ov * 0.65 + brightnessAdj));
          const [nr, ng, nb] = hsvToRgb(newH, newS, newV);

          outData[px]     = Math.round(nr * alpha + r * (1 - alpha));
          outData[px + 1] = Math.round(ng * alpha + g * (1 - alpha));
          outData[px + 2] = Math.round(nb * alpha + b * (1 - alpha));
        } else {
          outData[px]     = r;
          outData[px + 1] = g;
          outData[px + 2] = b;
        }
        outData[px + 3] = 255;
      }
    }

    // ============ CAMERA MODE ============

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } }
        });
        video.srcObject = stream;
        await video.play();

        // Set canvas size to match video
        liveCanvas.width = video.videoWidth;
        liveCanvas.height = video.videoHeight;

        cameraRunning = true;
        processFrame();
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
        statusEl.className = 'status error';
      }
    }

    function stopCamera() {
      cameraRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
    }

    let lastFrameTime = 0;
    let frameCount = 0;
    let fpsDisplay = 0;

    async function processFrame() {
      if (!cameraRunning || !segmenter) return;

      const now = performance.now();

      // Draw video frame to canvas
      liveCtx.drawImage(video, 0, 0);

      // Segment
      try {
        const result = segmenter.segmentForVideo(liveCanvas, now);

        if (result.confidenceMasks && result.confidenceMasks.length > 0) {
          const maskData = result.confidenceMasks[0].getAsFloat32Array();
          const w = liveCanvas.width, h = liveCanvas.height;

          // Build inverted mask
          const hairMask = new Float32Array(w * h);
          for (let i = 0; i < w * h; i++) {
            hairMask[i] = 1.0 - maskData[i];
          }

          // Get current frame pixels
          const frameData = liveCtx.getImageData(0, 0, w, h);
          const outImg = liveCtx.createImageData(w, h);

          applyColorToPixels(frameData.data, hairMask, w, h, outImg.data);
          liveCtx.putImageData(outImg, 0, 0);
        }
        result.close();
      } catch (e) {
        // Skip frame on error
      }

      // FPS counter
      frameCount++;
      if (now - lastFrameTime >= 1000) {
        fpsDisplay = frameCount;
        frameCount = 0;
        lastFrameTime = now;
        fpsEl.textContent = fpsDisplay + ' fps';
      }

      animFrameId = requestAnimationFrame(processFrame);
    }

    // ============ PHOTO MODE ============

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); });
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      if (!segmenter) return;
      statusEl.textContent = 'Processing...';

      const img = new Image();
      img.onload = async () => {
        const maxDim = 512;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        photoW = w; photoH = h;

        originalCanvas.width = w; originalCanvas.height = h;
        const origCtx = originalCanvas.getContext('2d');
        origCtx.drawImage(img, 0, 0, w, h);
        photoOriginalData = origCtx.getImageData(0, 0, w, h);

        resultCanvas.width = w; resultCanvas.height = h;

        // Need IMAGE mode for photos
        segmenter.setOptions({ runningMode: 'IMAGE' });
        const result = segmenter.segment(originalCanvas);

        if (result.confidenceMasks && result.confidenceMasks.length > 0) {
          const maskData = result.confidenceMasks[0].getAsFloat32Array();
          photoMask = new Float32Array(w * h);
          for (let i = 0; i < w * h; i++) {
            photoMask[i] = 1.0 - maskData[i];
          }
          applyPhotoColor();
          document.getElementById('photoContainer').classList.remove('hidden');
          statusEl.textContent = 'Done! Try different colors.';
          statusEl.className = 'status ready';
        }
        result.close();
        // Switch back to VIDEO mode if camera is active
        segmenter.setOptions({ runningMode: 'VIDEO' });
      };
      img.src = URL.createObjectURL(file);
    }

    function applyPhotoColor() {
      if (!photoMask || !photoOriginalData) return;
      const ctx = resultCanvas.getContext('2d');
      const outImg = ctx.createImageData(photoW, photoH);
      applyColorToPixels(photoOriginalData.data, photoMask, photoW, photoH, outImg.data);
      ctx.putImageData(outImg, 0, 0);
      resultLabel.textContent = selectedColor.name;
    }

    // ============ MODE SWITCHING ============

    const modeCameraBtn = document.getElementById('modeCameraBtn');
    const modePhotoBtn = document.getElementById('modePhotoBtn');
    const cameraModeEl = document.getElementById('cameraMode');
    const photoModeEl = document.getElementById('photoMode');

    modeCameraBtn.addEventListener('click', () => {
      if (mode === 'camera') return;
      mode = 'camera';
      modeCameraBtn.classList.add('active');
      modePhotoBtn.classList.remove('active');
      cameraModeEl.classList.remove('hidden');
      photoModeEl.classList.add('hidden');
      segmenter.setOptions({ runningMode: 'VIDEO' });
      startCamera();
    });

    modePhotoBtn.addEventListener('click', () => {
      if (mode === 'photo') return;
      mode = 'photo';
      modePhotoBtn.classList.add('active');
      modeCameraBtn.classList.remove('active');
      photoModeEl.classList.remove('hidden');
      cameraModeEl.classList.add('hidden');
      stopCamera();
    });

    // ============ COLOR PALETTE ============

    function buildPalette() {
      const palette = document.getElementById('colorPalette');
      COLORS.forEach((color, i) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn' + (i === 0 ? ' active' : '');
        btn.innerHTML = `<span class="color-swatch" style="background:${color.bg}"></span>${color.name}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColor = color;
          liveColorLabel.textContent = color.name;
          if (photoMask) applyPhotoColor();
        });
        palette.appendChild(btn);
      });
    }

    // ============ SLIDER EVENTS ============

    intensitySlider.addEventListener('input', () => {
      document.getElementById('intensityValue').textContent = intensitySlider.value;
      if (photoMask) applyPhotoColor();
    });
    brightnessSlider.addEventListener('input', () => {
      document.getElementById('brightnessValue').textContent = brightnessSlider.value;
      if (photoMask) applyPhotoColor();
    });

    // ============ INIT ============

    async function init() {
      try {
        statusEl.textContent = 'Loading MediaPipe Vision...';
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
        );

        statusEl.textContent = 'Loading Hair Segmenter model...';
        segmenter = await ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          outputCategoryMask: true,
          outputConfidenceMasks: true,
        });

        statusEl.textContent = 'Starting camera...';
        await startCamera();

        statusEl.textContent = 'Live! Change colors below.';
        statusEl.className = 'status ready';
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.className = 'status error';
        console.error(err);
      }
    }

    buildPalette();
    init();
  </script>
</body>
</html>
