<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Style & Color AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    h1 { margin-bottom: 4px; font-size: 1.3em; }
    .subtitle { color: #888; margin-bottom: 12px; font-size: 0.8em; }
    .status {
      background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
      padding: 8px 16px; margin-bottom: 12px; font-size: 0.8em; text-align: center;
    }
    .status.ready { border-color: #00b894; color: #00b894; }
    .status.processing { border-color: #fdcb6e; color: #fdcb6e; }
    .status.error { border-color: #e17055; color: #e17055; }

    /* Mode toggle */
    .mode-toggle { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
    .mode-btn {
      padding: 8px 16px; border: 2px solid #0f3460; border-radius: 8px;
      background: #16213e; color: #aaa; cursor: pointer; font-size: 0.8em; transition: all 0.2s;
    }
    .mode-btn.active { border-color: #e94560; color: #fff; background: #e94560; }

    /* Video area */
    .video-container {
      position: relative; margin-bottom: 12px; border-radius: 12px;
      overflow: hidden; background: #000; max-width: 640px; width: 100%;
    }
    .video-container video { display: none; width: 100%; }
    .video-container canvas { display: block; width: 100%; }
    .fps-counter {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6);
      padding: 3px 8px; border-radius: 4px; font-size: 0.7em; font-family: monospace;
    }
    .color-label {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
      padding: 3px 10px; border-radius: 4px; font-size: 0.8em;
    }

    /* Upload area */
    .upload-area {
      border: 2px dashed #0f3460; border-radius: 12px; padding: 30px;
      text-align: center; cursor: pointer; margin-bottom: 12px; max-width: 640px; width: 100%;
    }
    .upload-area:hover { border-color: #e94560; }
    .upload-area input { display: none; }

    /* Photo comparison */
    .photo-container {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
    }
    .photo-wrapper { position: relative; border-radius: 8px; overflow: hidden; background: #16213e; }
    .photo-wrapper canvas { display: block; max-width: 310px; height: auto; }
    .photo-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7); padding: 6px; text-align: center; font-size: 0.8em;
    }

    /* Color palette */
    .color-palette { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; max-width: 640px; }
    .color-btn {
      border: 2px solid transparent; border-radius: 8px; padding: 6px 12px;
      cursor: pointer; font-size: 0.8em; color: #fff; background: #16213e;
      transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .color-btn:hover { transform: scale(1.05); }
    .color-btn.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
    .color-swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }

    /* Controls */
    .controls {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 12px; max-width: 640px; width: 100%;
    }
    .slider-group { flex: 1; min-width: 180px; }
    .slider-group label { display: block; font-size: 0.75em; margin-bottom: 2px; color: #aaa; }
    .slider-group input[type=range] { width: 100%; }

    /* ====== STYLE FINDER ====== */
    .style-upload-area {
      border: 2px dashed #0f3460; border-radius: 12px; padding: 20px;
      text-align: center; cursor: pointer; margin-bottom: 12px; max-width: 640px; width: 100%;
    }
    .style-upload-area:hover { border-color: #e94560; }
    .style-upload-area input { display: none; }

    .face-result {
      background: #16213e; border: 1px solid #0f3460; border-radius: 12px;
      padding: 16px 24px; margin-bottom: 16px; text-align: center; max-width: 640px; width: 100%;
    }
    .face-shape-badge {
      display: inline-block; background: #e94560; color: #fff; padding: 6px 20px;
      border-radius: 20px; font-size: 1.1em; font-weight: bold; margin: 8px 0;
    }
    .face-measurements { font-size: 0.75em; color: #888; margin-top: 6px; }

    /* Category filters */
    .filter-section { margin-bottom: 12px; max-width: 640px; width: 100%; }
    .filter-label { font-size: 0.75em; color: #aaa; margin-bottom: 4px; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .filter-btn {
      padding: 4px 12px; border: 1px solid #0f3460; border-radius: 16px;
      background: #16213e; color: #aaa; cursor: pointer; font-size: 0.75em; transition: all 0.2s;
    }
    .filter-btn.active { border-color: #00b894; color: #00b894; background: #0a2a1e; }

    /* Style cards grid */
    .style-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px; max-width: 640px; width: 100%; margin-bottom: 20px;
    }
    .style-card {
      background: #16213e; border: 2px solid #0f3460; border-radius: 10px;
      overflow: hidden; cursor: pointer; transition: all 0.2s;
    }
    .style-card:hover { border-color: #e94560; transform: translateY(-2px); }
    .style-card-img {
      width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #0a0a1a;
    }
    .style-card-body { padding: 8px 10px; }
    .style-card-name { font-size: 0.85em; font-weight: bold; margin-bottom: 2px; }
    .style-card-meta { font-size: 0.65em; color: #888; margin-bottom: 4px; }
    .style-card-match {
      font-size: 0.7em; padding: 2px 8px; border-radius: 10px; display: inline-block;
    }
    .match-high { background: #0a2a1e; color: #00b894; }
    .match-mid { background: #2a2a0e; color: #fdcb6e; }
    .match-low { background: #2a0e0e; color: #e17055; }
    .style-card-desc { font-size: 0.7em; color: #aaa; margin-top: 4px; line-height: 1.3; }

    .hidden { display: none !important; }
  </style>
</head>

    const statusEl = document.getElementById('status');

    const liveCtx = liveCanvas.getContext('2d', { willReadFrequently: true });

    const liveColorLabel = document.getElementById('liveColorLabel');
    const intensitySlider = document.getElementById('intensity');
    const brightnessSlider = document.getElementById('brightness');

    // ==================== LAB COLOR SPACE ====================
    // sRGB(0-255) -> Linear RGB lookup table for speed
    const SRGB_TO_LINEAR = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const c = i / 255;
      SRGB_TO_LINEAR[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }
    function linearToSrgb(c) {
      c = c < 0 ? 0 : (c > 1 ? 1 : c);
      const v = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      return Math.round(v * 255);
    }

    // D65 reference white
    const Xn = 0.95047, Yn = 1.00000, Zn = 1.08883;
    // LAB epsilon/kappa
    const LAB_E = 216 / 24389;      // 0.008856
    const LAB_K = 24389 / 27;       // 903.3
    function labF(t) {
      return t > LAB_E ? Math.cbrt(t) : (LAB_K * t + 16) / 116;
    }
    function labFInv(t) {
      const t3 = t * t * t;
      return t3 > LAB_E ? t3 : (116 * t - 16) / LAB_K;
    }

    // sRGB(0-255) -> LAB
    function rgbToLab(r, g, b) {
      const lr = SRGB_TO_LINEAR[r], lg = SRGB_TO_LINEAR[g], lb = SRGB_TO_LINEAR[b];
      const x = (lr * 0.4124564 + lg * 0.3575761 + lb * 0.1804375) / Xn;
      const y = (lr * 0.2126729 + lg * 0.7151522 + lb * 0.0721750) / Yn;
      const z = (lr * 0.0193339 + lg * 0.1191920 + lb * 0.9503041) / Zn;
      const fx = labF(x), fy = labF(y), fz = labF(z);
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }

    // LAB -> sRGB(0-255)
    function labToRgb(L, a, b) {
      const fy = (L + 16) / 116;
      const fx = a / 500 + fy;
      const fz = fy - b / 200;
      const x = Xn * labFInv(fx);
      const y = Yn * labFInv(fy);
      const z = Zn * labFInv(fz);
      const lr = x *  3.2404542 + y * -1.5371385 + z * -0.4985314;
      const lg = x * -0.9692660 + y *  1.8760108 + z *  0.0415560;
      const lb = x *  0.0556434 + y * -0.2040259 + z *  1.0572252;
      return [linearToSrgb(lr), linearToSrgb(lg), linearToSrgb(lb)];
    }

    // Convert hex color to LAB
    function hexToLab(hex) {
      const m = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
      const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
      return rgbToLab(r, g, b);
    }

    // Precompute LAB values for all color presets (uses bg swatch as truth)
    COLORS.forEach(c => {
      const [L, a, b] = hexToLab(c.bg);
      c.labL = L; c.labA = a; c.labB = b;
    });

    // ==================== PIXEL APPLY (LAB) ====================
    // Approach:
    //   - Preserve original L (luminance) to keep hair texture, gloss, shadows
    //   - Shift a/b toward target color based on mask * intensity
    //   - Optional L adjustment via brightness slider
    //   - Mask edge softening via power function
    function applyColorToPixels(srcData, maskData, w, h, outData) {
      const intensity = intensitySlider.value / 100;
      const brightnessAdj = (brightnessSlider.value / 100) * 25; // ±12.5 on L scale
      const targetA = selectedColor.labA;
      const targetB = selectedColor.labB;
      const total = w * h;

      for (let i = 0; i < total; i++) {
        const px = i * 4;
        const r = srcData[px], g = srcData[px + 1], b = srcData[px + 2];
        let m = maskData[i];

        // Mask edge refinement:
        //   - Drop very low confidence (noise / bleed)
        //   - Power function sharpens mid-range falloff
        if (m < 0.12) {
          outData[px] = r; outData[px + 1] = g; outData[px + 2] = b; outData[px + 3] = 255;
          continue;
        }
        m = Math.pow(m, 1.4);
        const alpha = m * intensity;

        // Convert to LAB, preserve L, blend chroma toward target
        const lr = SRGB_TO_LINEAR[r], lg = SRGB_TO_LINEAR[g], lb = SRGB_TO_LINEAR[b];
        const xn = (lr * 0.4124564 + lg * 0.3575761 + lb * 0.1804375) / Xn;
        const yn = (lr * 0.2126729 + lg * 0.7151522 + lb * 0.0721750) / Yn;
        const zn = (lr * 0.0193339 + lg * 0.1191920 + lb * 0.9503041) / Zn;
        const fyv = labF(yn);
        const L = 116 * fyv - 16;
        const a = 500 * (labF(xn) - fyv);
        const bL = 200 * (fyv - labF(zn));

        // Preserve L, shift a/b toward target by alpha
        let newL = L + brightnessAdj * alpha;
        if (newL < 0) newL = 0; else if (newL > 100) newL = 100;
        const newA = a + (targetA - a) * alpha;
        const newB = bL + (targetB - bL) * alpha;

        // LAB -> linear RGB -> sRGB
        const fy2 = (newL + 16) / 116;
        const fx2 = newA / 500 + fy2;
        const fz2 = fy2 - newB / 200;
        const x2 = Xn * labFInv(fx2);
        const y2 = Yn * labFInv(fy2);
        const z2 = Zn * labFInv(fz2);
        const nlr = x2 *  3.2404542 + y2 * -1.5371385 + z2 * -0.4985314;
        const nlg = x2 * -0.9692660 + y2 *  1.8760108 + z2 *  0.0415560;
        const nlb = x2 *  0.0556434 + y2 * -0.2040259 + z2 *  1.0572252;

        outData[px]     = linearToSrgb(nlr);
        outData[px + 1] = linearToSrgb(nlg);
        outData[px + 2] = linearToSrgb(nlb);
        outData[px + 3] = 255;
      }
    }

    // ==================== FACE SHAPE DETECTION ====================
    function classifyFaceShape(landmarks) {
      // Key landmark indices for measurements
      const lm = landmarks;
      // Face length: forehead top (10) to chin (152)
      const faceLength = Math.abs(lm[10].y - lm[152].y);
      // Forehead width: left temple (70) to right temple (300)
      const foreheadWidth = Math.abs(lm[70].x - lm[300].x);
      // Cheekbone width: left cheek (234) to right cheek (454)
      const cheekboneWidth = Math.abs(lm[234].x - lm[454].x);
      // Jawline width: left jaw (172) to right jaw (397)
      const jawlineWidth = Math.abs(lm[172].x - lm[397].x);

      const avgWidth = (foreheadWidth + cheekboneWidth + jawlineWidth) / 3;
      const lengthToWidth = faceLength / avgWidth;
      const fwRatio = foreheadWidth / cheekboneWidth;
      const jwRatio = jawlineWidth / cheekboneWidth;

      let shape;
      if (lengthToWidth > 1.55) {
        shape = 'oblong';
      } else if (lengthToWidth < 1.15) {
        shape = 'round';
      } else if (jwRatio > 0.9 && fwRatio > 0.9) {
        shape = 'square';
      } else if (fwRatio > 0.95 && jwRatio < 0.75) {
        shape = 'heart';
      } else if (fwRatio < 0.85 && jwRatio < 0.85) {
        shape = 'diamond';
      } else {
        shape = 'oval';
      }

      return {
        shape,
        measurements: { faceLength, foreheadWidth, cheekboneWidth, jawlineWidth, lengthToWidth }
      };
    }

    // ==================== CAMERA MODE ====================
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } }
        });
        video.srcObject = stream;
        await video.play();
        liveCanvas.width = video.videoWidth;
        liveCanvas.height = video.videoHeight;
        cameraRunning = true;
        processFrame();
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
        statusEl.className = 'status error';
      }
    }
    function stopCamera() {
      cameraRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
    }

    let lastFrameTime = 0, frameCount = 0, fpsDisplay = 0;

    async function processFrame() {
      if (!cameraRunning || !segmenter) return;
      const now = performance.now();
      liveCtx.drawImage(video, 0, 0);
      try {
        const result = segmenter.segmentForVideo(liveCanvas, now);
        if (result.confidenceMasks && result.confidenceMasks.length > 0) {
          const maskData = result.confidenceMasks[0].getAsFloat32Array();
          const w = liveCanvas.width, h = liveCanvas.height;
          const hairMask = new Float32Array(w * h);
          for (let i = 0; i < w * h; i++) hairMask[i] = 1.0 - maskData[i];
          const frameData = liveCtx.getImageData(0, 0, w, h);
          const outImg = liveCtx.createImageData(w, h);
          applyColorToPixels(frameData.data, hairMask, w, h, outImg.data);
          liveCtx.putImageData(outImg, 0, 0);
        }
        result.close();
      } catch (e) {}
      frameCount++;
      if (now - lastFrameTime >= 1000) { fpsDisplay = frameCount; frameCount = 0; lastFrameTime = now; fpsEl.textContent = fpsDisplay + ' fps'; }
      animFrameId = requestAnimationFrame(processFrame);
    }

    // ==================== PHOTO MODE ====================
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => e.preventDefault());
    uploadArea.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) handlePhotoFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if (e.target.files.length) handlePhotoFile(e.target.files[0]); });

    async function handlePhotoFile(file) {
      if (!segmenter) return;
      statusEl.textContent = 'Processing...'; statusEl.className = 'status processing';
      const img = new Image();
      img.onload = async () => {
        const maxDim = 512;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        photoW = w; photoH = h;
        const origCanvas = document.getElementById('originalCanvas');
        origCanvas.width = w; origCanvas.height = h;
        const origCtx = origCanvas.getContext('2d');
        origCtx.drawImage(img, 0, 0, w, h);
        photoOriginalData = origCtx.getImageData(0, 0, w, h);
        const resCanvas = document.getElementById('resultCanvas');
        resCanvas.width = w; resCanvas.height = h;
        segmenter.setOptions({ runningMode: 'IMAGE' });
        const result = segmenter.segment(origCanvas);
        if (result.confidenceMasks && result.confidenceMasks.length > 0) {
          const maskData = result.confidenceMasks[0].getAsFloat32Array();
          photoMask = new Float32Array(w * h);
          for (let i = 0; i < w * h; i++) photoMask[i] = 1.0 - maskData[i];
          applyPhotoColor();
          document.getElementById('photoContainer').classList.remove('hidden');
          statusEl.textContent = 'Done! Try different colors.'; statusEl.className = 'status ready';
        }
        result.close();
        segmenter.setOptions({ runningMode: 'VIDEO' });
      };
      img.src = URL.createObjectURL(file);
    }
    function applyPhotoColor() {
      if (!photoMask || !photoOriginalData) return;
      const ctx = document.getElementById('resultCanvas').getContext('2d');
      const outImg = ctx.createImageData(photoW, photoH);
      applyColorToPixels(photoOriginalData.data, photoMask, photoW, photoH, outImg.data);
      ctx.putImageData(outImg, 0, 0);
      document.getElementById('resultLabel').textContent = selectedColor.name;
    }

    // ==================== STYLE FINDER MODE ====================
    const styleUploadArea = document.getElementById('styleUploadArea');
    const styleFileInput = document.getElementById('styleFileInput');
    styleUploadArea.addEventListener('click', () => styleFileInput.click());
    styleFileInput.addEventListener('change', e => { if (e.target.files.length) handleStyleFile(e.target.files[0]); });

    async function handleStyleFile(file) {
      if (!faceLandmarker) { statusEl.textContent = 'Face model not loaded'; return; }
      statusEl.textContent = 'Analyzing face shape...'; statusEl.className = 'status processing';
      const img = new Image();
      img.onload = async () => {
        const maxDim = 512;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        const canvas = document.getElementById('styleAnalysisCanvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        faceLandmarker.setOptions({ runningMode: 'IMAGE' });
        const result = faceLandmarker.detect(canvas);
        faceLandmarker.setOptions({ runningMode: 'VIDEO' });

        if (result.faceLandmarks && result.faceLandmarks.length > 0) {
          const analysis = classifyFaceShape(result.faceLandmarks[0]);
          detectedFaceShape = analysis.shape;

          // Show result
          document.getElementById('faceShapeBadge').textContent = FACE_SHAPE_NAMES[analysis.shape];
          const m = analysis.measurements;
          document.getElementById('faceMeasurements').textContent =
            `L/W ratio: ${m.lengthToWidth.toFixed(2)} | Forehead: ${(m.foreheadWidth*100).toFixed(0)} | Cheek: ${(m.cheekboneWidth*100).toFixed(0)} | Jaw: ${(m.jawlineWidth*100).toFixed(0)}`;
          document.getElementById('faceResult').classList.remove('hidden');
          document.getElementById('styleFilters').classList.remove('hidden');

          renderStyleCards();
          statusEl.textContent = 'Face analyzed! Browse recommended styles.'; statusEl.className = 'status ready';
        } else {
          statusEl.textContent = 'No face detected. Please try a different photo.'; statusEl.className = 'status error';
        }
      };
      img.src = URL.createObjectURL(file);
    }

    function renderStyleCards() {
      const grid = document.getElementById('styleGrid');
      grid.innerHTML = '';

      let filtered = STYLES.filter(s => {
        if (activeFilters.length !== 'all' && s.length !== activeFilters.length) return false;
        if (activeFilters.taste !== 'all' && s.taste !== activeFilters.taste) return false;
        return true;
      });

      // Sort by face match score
      const shape = detectedFaceShape || 'oval';
      filtered.sort((a, b) => (b.match[shape] || 0) - (a.match[shape] || 0));

      filtered.forEach(style => {
        const score = style.match[shape] || 0;
        const matchClass = score >= 0.8 ? 'match-high' : score >= 0.6 ? 'match-mid' : 'match-low';
        const matchText = score >= 0.8 ? '相性◎' : score >= 0.6 ? '相性○' : '相性△';

        const card = document.createElement('div');
        card.className = 'style-card';
        card.innerHTML = `
          <img class="style-card-img" src="${style.img}" alt="${style.name}" loading="lazy" onerror="this.style.background='#2a2a4e'">
          <div class="style-card-body">
            <div class="style-card-name">${style.name}</div>
            <div class="style-card-meta">${LENGTH_LABELS[style.length]} / ${TASTE_LABELS[style.taste]}</div>
            <span class="style-card-match ${matchClass}">${matchText} ${Math.round(score * 100)}%</span>
            <div class="style-card-desc">${style.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter buttons
    document.getElementById('lengthFilters').addEventListener('click', e => {
      if (!e.target.matches('.filter-btn')) return;
      document.querySelectorAll('#lengthFilters .filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeFilters.length = e.target.dataset.filter;
      renderStyleCards();
    });
    document.getElementById('tasteFilters').addEventListener('click', e => {
      if (!e.target.matches('.filter-btn')) return;
      document.querySelectorAll('#tasteFilters .filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeFilters.taste = e.target.dataset.filter;
      renderStyleCards();
    });

    // ==================== MODE SWITCHING ====================
    const modeCameraBtn = document.getElementById('modeCameraBtn');
    const modePhotoBtn = document.getElementById('modePhotoBtn');
    const modeStyleBtn = document.getElementById('modeStyleBtn');
    const cameraModeEl = document.getElementById('cameraMode');
    const photoModeEl = document.getElementById('photoMode');
    const styleModeEl = document.getElementById('styleMode');
    const colorControlsEl = document.getElementById('colorControls');

    function switchMode(newMode) {
      if (mode === newMode) return;
      mode = newMode;
      [modeCameraBtn, modePhotoBtn, modeStyleBtn].forEach(b => b.classList.remove('active'));
      [cameraModeEl, photoModeEl, styleModeEl].forEach(el => el.classList.add('hidden'));

      if (newMode === 'camera') {
        modeCameraBtn.classList.add('active');
        cameraModeEl.classList.remove('hidden');
        colorControlsEl.classList.remove('hidden');
        segmenter.setOptions({ runningMode: 'VIDEO' });
        startCamera();
      } else if (newMode === 'photo') {
        modePhotoBtn.classList.add('active');
        photoModeEl.classList.remove('hidden');
        colorControlsEl.classList.remove('hidden');
        stopCamera();
      } else if (newMode === 'style') {
        modeStyleBtn.classList.add('active');
        styleModeEl.classList.remove('hidden');
        colorControlsEl.classList.add('hidden');
        stopCamera();
      }
    }
    modeCameraBtn.addEventListener('click', () => switchMode('camera'));
    modePhotoBtn.addEventListener('click', () => switchMode('photo'));
    modeStyleBtn.addEventListener('click', () => switchMode('style'));

    // ==================== COLOR PALETTE ====================
    function buildPalette() {
      const palette = document.getElementById('colorPalette');
      COLORS.forEach((color, i) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn' + (i === 0 ? ' active' : '');
        btn.innerHTML = `<span class="color-swatch" style="background:${color.bg}"></span>${color.name}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColor = color;
          liveColorLabel.textContent = color.name;
          if (photoMask) applyPhotoColor();
        });
        palette.appendChild(btn);
      });
    }

    intensitySlider.addEventListener('input', () => { document.getElementById('intensityValue').textContent = intensitySlider.value; if (photoMask) applyPhotoColor(); });
    brightnessSlider.addEventListener('input', () => { document.getElementById('brightnessValue').textContent = brightnessSlider.value; if (photoMask) applyPhotoColor(); });

    // ==================== INIT ====================
    async function init() {
      try {
        statusEl.textContent = 'Loading MediaPipe Vision...';
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
        );

        statusEl.textContent = 'Loading Hair Segmenter...';
        segmenter = await ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          outputCategoryMask: true,
          outputConfidenceMasks: true,
        });

        statusEl.textContent = 'Loading Face Landmarker...';
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          numFaces: 1,
        });

        statusEl.textContent = 'Starting camera...';
        await startCamera();
        statusEl.textContent = 'Live! Change colors below or try Style Finder.';
        statusEl.className = 'status ready';
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.className = 'status error';
        console.error(err);
      }
    }

    buildPalette();
    init();
  </script>
</body>
</html>
